name: Deploy NUMERA Custom Domain

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numera-custom-domain
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: numera.rechord.online
      HOST: 213.182.208.29
      SSH_KEY: ${{ secrets.NUMERA_SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          test -n "$SSH_KEY" || { echo 'NUMERA_SERVER_SSH_KEY is not configured'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/numera
          chmod 600 ~/.ssh/numera
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Deploy NUMERA only
        run: |
          rsync -az --delete --exclude .git --exclude .github -e "ssh -i ~/.ssh/numera -o IdentitiesOnly=yes" ./ root@$HOST:/var/www/numera/
          ssh -i ~/.ssh/numera -o IdentitiesOnly=yes root@$HOST 'bash -s' <<'REMOTE'
          set -e
          domain=numera.rechord.online
          cat >/etc/nginx/sites-available/$domain <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name numera.rechord.online;
            root /var/www/numera;
            index index.html;
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/$domain /etc/nginx/sites-enabled/$domain
          nginx -t
          systemctl reload nginx
          certbot --nginx --non-interactive --agree-tos --email lostvoxmusic@gmail.com --redirect -d "$domain"
          nginx -t
          systemctl reload nginx
          curl -fsS --resolve "$domain:443:127.0.0.1" "https://$domain/" | grep -q 'NUMERA'
          REMOTE
      - name: Verify custom domain
        run: curl --retry 6 --retry-delay 4 -fsSI "https://$DOMAIN/"
